        <article class="purpose-story info-block--wide">
          <header class="purpose-story-header">
            <p class="kicker">Why we exist</p>
            <h2>Our purpose</h2>
            <p class="purpose-lead">Built together. Bound together. Strong together.</p>
          </header>

          <div class="purpose-prose">
            <p>
              The Nordic Empire did not begin as a conquest or a flag planted for show. Four founders gathered on DiplomaticaMC and asked a simpler question: where can the Nordic people live, work, and stay loyal to one another under one roof? The answer became a realm with Scandinavian roots, a Protestant church, and a capital that keeps the nation steady while Stavanger gives people a place to call home.
            </p>
            <p>
              That is still the heart of it. We make living space. Plots, paths, halls, and public builds are not decoration; they are the proof that residents pull the same direction. Clear law keeps the peace. Loyalty and discipline turn a list of players into one people.
            </p>
            <p>
              For now the gaze stays inward. Before the Nordic Empire looks far beyond its borders, the first work is to raise the state itself: towns that feel finished, institutions that hold, and a people already bound to one another.
            </p>
          </div>

          <ol class="purpose-beats" role="list">
            <li>
              <h3>Build the realm</h3>
              <p>Raise Heimstad and Stavanger with shared labour. Expect residents who stick together, honour duty to the realm, and put the common build before vanity.</p>
            </li>
            <li>
              <h3>Steady the state</h3>
              <p>Law, church, and crown before distant ambitions. A nation that stands firm at home has little need to chase noise at the edge of the map.</p>
            </li>
            <li>
              <h3>Guard what we make</h3>
              <p>Defence protects the realm and its people. Readiness and the shield of the King exist so homes and work endure.</p>
            </li>
          </ol>

          <div class="purpose-prose purpose-prose--close">
            <p>
              Order at home. Unity among residents. Strength grown from within. That is the Nordic Empire we build every session: not a raid calendar, but a lasting place under one law and one motto.
            </p>
            <p class="purpose-links">
              Read the full law in the <a href="#constitution" data-tab="constitution">Constitution of the Nordic Empire</a>. Trace the founding and early milestones in <a href="#history" data-tab="history">History</a>.
            </p>
