            <h1 id="times-title" class="paper-name">The Nordic Times</h1>
            <p class="paper-tagline">Built together. Bound together. Strong together.</p>
            <p class="paper-dateline"><time datetime="2026-07-28">Tuesday, 28 July 2026</time> · Heimstad &amp; Stavanger</p>
          </header>

