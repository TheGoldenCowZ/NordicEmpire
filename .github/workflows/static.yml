    <!-- CONSTITUTION -->
    <section id="constitution" class="panel panel--constitution" aria-labelledby="constitution-title" hidden>
      <div class="page-wrap page-wrap--narrow">
        <header class="section-header constitution-masthead">
          <p class="kicker">Supreme law of the realm</p>
          <h1 id="constitution-title" class="section-title">The Constitution of the Nordic Empire</h1>
          <p class="constitution-meta">On DiplomaticaMC · Ratified 28 July 2026 · In force</p>
        </header>

        <article class="constitution-doc">
          <p class="constitution-preamble">
            We, the residents of the Nordic Empire on DiplomaticaMC, establish this Constitution so that our nation may endure as one people under one law: built together, bound together, strong together.
          </p>

          <h2 class="constitution-chapter">A. Form of government</h2>

          <section class="constitution-article" id="art-1">
            <h3><span class="art-num">Article 1.</span> The realm</h3>
            <p>The Nordic Empire is a free, independent, indivisible and inalienable realm on DiplomaticaMC. Its form of government is a limited monarchy under the King.</p>
          </section>

          <section class="constitution-article" id="art-2">
            <h3><span class="art-num">Article 2.</span> Values</h3>
            <p>Our values will remain our Protestant heritage. This Constitution shall ensure order among residents, unity of the nation, respect for server rules, and the dignity of all inhabitants of the realm. Residents owe loyalty to the Nordic Empire and to one another.</p>
          </section>

          <h2 class="constitution-chapter">B. The executive power, the King, and religion</h2>

          <section class="constitution-article" id="art-3">
            <h3><span class="art-num">Article 3.</span> Executive power</h3>
            <p>The executive power is vested in the King. This Constitution does not replace in-game Towny mechanics; it binds how the Nordic Empire’s players agree to live and work together on top of server rules.</p>
          </section>

          <section class="constitution-article" id="art-4">
            <h3><span class="art-num">Article 4.</span> The King’s faith</h3>
            <p>The King shall at all times profess the Protestant religion.</p>
          </section>

          <section class="constitution-article" id="art-5">
            <h3><span class="art-num">Article 5.</span> Capital and territory</h3>
            <p>The capital of the realm is Heimstad. Stavanger is the principal residential town of the nation. Nation territory is whatever chunks the Nordic Empire holds on the DiplomaticaMC map, including member towns admitted under Article 9.</p>
          </section>

          <section class="constitution-article" id="art-6">
            <h3><span class="art-num">Article 6.</span> Religion of the realm</h3>
            <p>The religion of the realm is Protestantism alone. The Church of the Nordic Empire, a Protestant church, is the Established Church of the Nordic Empire and will as such be supported by the nation in builds, ceremonies, and public life. Detailed provisions as to its system may be laid down by the King. No other religion shall be established, practised, or promoted within the nation.</p>
          </section>

          <h2 class="constitution-chapter">C. Rights of citizens</h2>

          <section class="constitution-article" id="art-7">
            <h3><span class="art-num">Article 7.</span> Rights of residents</h3>
            <p>Every resident may settle in Stavanger, visit Heimstad, use public shops and paths, read official documents, and live under the protection of this Constitution. No resident shall be expelled from a town or from shared public builds without notice from the King or from the mayor of that town.</p>
          </section>

          <section class="constitution-article" id="art-8">
            <h3><span class="art-num">Article 8.</span> Duties of residents</h3>
            <p>Residents honour server rules, respect claimed plots, pay agreed shop prices, and serve the common good of the nation. Raiding allied or neutral towns, griefing nation storage, or leaking unreleased town plans violates this Constitution.</p>
          </section>

          <section class="constitution-article" id="art-9">
            <h3><span class="art-num">Article 9.</span> Towns and admission</h3>
            <p>Stavanger is open: anyone may join the residential town and become a resident. Additional towns enter the nation by charter: mayors who accept the Nordic Empire’s neutrality and the articles of this Constitution.</p>
          </section>

          <section class="constitution-article" id="art-10">
            <h3><span class="art-num">Article 10.</span> Neutrality and purpose</h3>
            <p>The Nordic Empire is a neutral nation. We do not seek wars of conquest. Our purpose is cooperative growth: harbour trade, shared builds, food security, and diplomacy with border towns before force. Defence exists to protect residents and escort hauls, not to raid neighbours without cause.</p>
          </section>

          <section class="constitution-article" id="art-11">
            <h3><span class="art-num">Article 11.</span> Economy</h3>
            <p>Trade is encouraged at the capital and residential market rows. Shared contributions may fund public infrastructure, farms, and defence readiness before vanity builds.</p>
          </section>

          <h2 class="constitution-chapter">D. Stewardship of animals and the land</h2>

          <section class="constitution-article" id="art-12">
            <h3><span class="art-num">Article 12.</span> Protection of animals</h3>
            <p>Animals within the realm shall not be harmed unnecessarily. Every resident shall treat livestock, pets, wildlife, and working animals with care. Cruelty for sport, torment, or display is forbidden.</p>
          </section>

          <section class="constitution-article" id="art-13">
            <h3><span class="art-num">Article 13.</span> Animal abuse</h3>
            <p>Animal abuse shall not be tolerated. The King may exclude from farms, pens, and society builds any resident who wilfully abuses animals. Repeated abuse is grounds for removal from shared nation projects after notice.</p>
          </section>

          <section class="constitution-article" id="art-14">
            <h3><span class="art-num">Article 14.</span> Ethical farming only</h3>
            <p>Farming in the Nordic Empire shall be ethical only. Nation farms and town agriculture shall provide adequate space, feed, and shelter; shall not keep animals in needless suffering; and shall harvest only what is needed for the sustenance and trade of the realm. Factory-style cruelty and wasteful slaughter for spectacle have no place under this Constitution.</p>
          </section>

          <section class="constitution-article" id="art-15">
            <h3><span class="art-num">Article 15.</span> Land and food security</h3>
            <p>Fields, pens, and food stores shall follow the standards of Articles 12 to 14. Border towns joining under Article 9 accept these standards as a condition of charter.</p>
          </section>

          <h2 class="constitution-chapter">E. General provisions</h2>

          <section class="constitution-article" id="art-16">
            <h3><span class="art-num">Article 16.</span> Record</h3>
            <p>The nation shall keep a record of charters, plans, and before/after views for future residents. The Nordic Times may publish matters of public interest.</p>
          </section>

          <section class="constitution-article" id="art-17">
            <h3><span class="art-num">Article 17.</span> Amendments</h3>
            <p>Amendments require the King’s consent and publication in the Nordic Times and on this page with a new date. No amendment may abolish the Protestant religion of the realm under Articles 4 and 6, except by a solemn act of the King published to all residents.</p>
          </section>

          <section class="constitution-article" id="art-18">
            <h3><span class="art-num">Article 18.</span> Entry into force</h3>
            <p>This Constitution enters into force on 28 July 2026, as ratified by <span class="player-ref"><img class="player-head" src="assets/players/thegoldencowz.png" alt="" width="22" height="22"><span>TheGoldenCowZ</span></span>, King of the Nordic Empire.</p>
          </section>

          <p class="constitution-closing">Given at Heimstad, 28 July 2026.</p>
        </article>
      </div>
    </section>

