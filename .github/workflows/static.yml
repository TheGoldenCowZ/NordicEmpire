              <p class="paper-deck">Four founders raise a realm on DiplomaticaMC. With the Constitution ratified, the Nordic Empire stands as one people under one law.</p>
              <p class="paper-lead-body">Heimstad is the capital. Stavanger is home. <span class="player-ref"><img class="player-head" src="assets/players/thegoldencowz.png" alt="" width="22" height="22"><span>TheGoldenCowZ</span></span> reigns as King; <span class="player-ref"><img class="player-head" src="assets/players/jfizzle9000.png" alt="" width="22" height="22"><span>Jfizzle9000</span></span>, <span class="player-ref"><img class="player-head" src="assets/players/gisa1327.png" alt="" width="22" height="22"><span>Gisa1327</span></span>, and <span class="player-ref"><img class="player-head" src="assets/players/zaksmak8113.png" alt="" width="22" height="22"><span>Zaksmak8113</span></span> stand with him among the founders. The Constitution settles the form of government, the Protestant faith of the realm, and the Church of the Nordic Empire as Established Church. Built together. Bound together. Strong together.</p>
              <p class="paper-continue">Continue reading</p>
            </a>

