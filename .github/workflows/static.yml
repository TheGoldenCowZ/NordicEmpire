# Deploy static site to the gh-pages branch (served by GitHub Pages).
# Bypasses actions/deploy-pages, which is currently timing out on GitHub's side.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          # Adds .nojekyll so Pages serves files as-is
          enable_jekyll: false
          exclude_assets: ".github,scripts,package.json,.gitattributes"
