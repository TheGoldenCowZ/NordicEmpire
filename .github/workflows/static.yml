        <article id="times-story-farmco-opens" class="times-story" data-story="farmco-opens" hidden>
          <p class="times-back"><a href="#times" data-route="times">← Back to The Nordic Times</a></p>
          <p class="paper-kicker">Commerce · 20 July 2026</p>
          <h1>FarmCo opens: the Nordic Empire’s first company</h1>
          <p class="times-byline">By the Nordic Times commercial desk</p>
          <div class="times-body">
            <p>STAVANGER. The Nordic Empire has opened its first company. <strong>FarmCo</strong> is state-run and stands as the selling side of the nation’s goods: the shopfront where farm produce meets buyers.</p>
            <p>FarmCo does not chase private vanity. It moves crops and farm goods from the realm’s fields into market chests at prices set for the common good. When Åkerby rises as the first farm town, the same pipeline will feed FarmCo’s shelves.</p>
            <p>Residents who farm for the Nordic Empire are feeding one company and one people. Built together. Bound together. Strong together.</p>
          </div>
        </article>

        <article id="times-story-stavanger-launch" class="times-story" data-story="stavanger-launch" hidden>
          <p class="times-back"><a href="#times" data-route="times">← Back to The Nordic Times</a></p>
          <p class="paper-kicker">Nation · 1 June 2026</p>
          <h1>Stavanger opens its gates</h1>
          <p class="times-byline">By the Nordic Times editorial desk</p>
          <div class="times-body">
            <p>STAVANGER. On 1 June 2026 the Nordic Empire opened its residential town. Stavanger is the place to live: plots, neighbours, and a clear path in for anyone who joins DiplomaticaMC.</p>
            <p>Residents connect with IP <code>diplomaticamc.com</code>, then run <code>/t join Stavanger</code> in chat. No application is required. Heimstad stands as the capital; Stavanger is home.</p>
            <p>Co-leader <span class="player-ref"><img class="player-head" src="assets/players/jfizzle9000.png" alt="" width="22" height="22"><span>Jfizzle9000</span></span> serves as mayor of Stavanger. Since opening day, the town has grown beyond 300 claimed chunks and added an underground shopping mall for residents and visitors.</p>
          </div>
        </article>

        <article id="times-story-heimstad-capital" class="times-story" data-story="heimstad-capital" hidden>
          <p class="times-back"><a href="#times" data-route="times">← Back to The Nordic Times</a></p>
          <p class="paper-kicker">Nation · 21 June 2026</p>
          <h1>Heimstad named capital of the Nordic Empire</h1>
          <p class="times-byline">By the Nordic Times editorial desk</p>
          <div class="times-body">
            <p>HEIMSTAD. <span class="player-ref"><img class="player-head" src="assets/players/thegoldencowz.png" alt="" width="22" height="22"><span>TheGoldenCowZ</span></span> and fellow residents confirm Heimstad as the capital of the Nordic Empire on DiplomaticaMC. Stavanger remains the main residential town, open since 1 June.</p>
            <p>Next on the horizon is Åkerby, the Nordic Empire’s first farm town, tied to FarmCo as the selling side of its harvest. Diplomacy with border towns will follow as the map allows.</p>
          </div>
        </article>

        <article id="times-story-constitution-in-force" class="times-story" data-story="constitution-in-force" hidden>
          <p class="times-back"><a href="#times" data-route="times">← Back to The Nordic Times</a></p>
          <p class="paper-kicker">Nation · 28 July 2026</p>
          <h1>The Nordic Empire is founded</h1>
          <p class="times-byline">By the Nordic Times editorial desk</p>
          <div class="times-body">
            <p>HEIMSTAD. The nation of the Nordic Empire has been founded on DiplomaticaMC. Four founders raised the realm: <strong class="player-ref"><img class="player-head" src="assets/players/thegoldencowz.png" alt="" width="22" height="22"><span>TheGoldenCowZ</span></strong>, King of the Nordic Empire; <strong class="player-ref"><img class="player-head" src="assets/players/jfizzle9000.png" alt="" width="22" height="22"><span>Jfizzle9000</span></strong>, co-leader and mayor of Stavanger; and fellow founders <strong class="player-ref"><img class="player-head" src="assets/players/gisa1327.png" alt="" width="22" height="22"><span>Gisa1327</span></strong> and <strong class="player-ref"><img class="player-head" src="assets/players/zaksmak8113.png" alt="" width="22" height="22"><span>Zaksmak8113</span></strong>.</p>
            <p>With the Constitution ratified on this day, the Nordic Empire stands under one supreme law: a limited monarchy, Protestant faith of the King, and the Church of the Nordic Empire as the sole Established Church. Protestantism is the religion of the realm. Heimstad is the capital; Stavanger is home for most residents.</p>
            <p>The early work turns inward: raise the towns, steady the state, and bind residents to one another before the map pulls the gaze outward. Residents may read the full text on the <a href="#constitution" data-tab="constitution">Constitution</a> page.</p>
            <p>Built together. Bound together. Strong together.</p>
          </div>
        </article>

        <article id="times-story-akerby-planned" class="times-story" data-story="akerby-planned" hidden>
          <p class="times-back"><a href="#times" data-route="times">← Back to The Nordic Times</a></p>
          <p class="paper-kicker">Plans · 21 June 2026</p>
          <h1>Åkerby on the horizon</h1>
          <p class="times-byline">By the Nordic Times planning desk</p>
          <div class="times-body">
            <p>NORDIC EMPIRE. Åkerby will be the Nordic Empire’s first farm town. Fields and food for the realm come first; FarmCo stands ready as the selling side of those goods.</p>
            <p>Until the town rises, FarmCo already serves as the nation’s first company: state-run, public, and aimed at the common market rather than private display.</p>
          </div>
        </article>
